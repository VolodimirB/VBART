<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Veronika Bondarenko</title>
  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,500,400&f[]=cormorant-garamond@700,700i,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <script src="js/nav.js"></script>

  <main class="page-content">
    <div class="contact-layout">

      <div class="contact-left">
        <div class="contact-info">
          <div class="contact-info-block">
            <span class="contact-info-label">Contact</span>
            <a class="contact-info-item" href="mailto:veronikabondarenko.art@gmail.com">veronikabondarenko.art@gmail.com</a>
          </div>
          <div class="contact-info-block">
            <span class="contact-info-label">Follow</span>
            <a class="contact-info-item" href="https://instagram.com/_veronikabondarenko" target="_blank" rel="noopener">@_veronikabondarenko</a>
          </div>
        </div>
      </div>

      <div class="contact-right">
        <h1 class="contact-heading">Get in Touch</h1>
        <form class="contact-form" name="contact" method="POST" data-netlify="true" action="/thanks">
          <input type="hidden" name="form-name" value="contact">

          <div class="form-group">
            <label class="form-label" for="name">Name</label>
            <input class="form-input" type="text" id="name" name="name" required autocomplete="name">
          </div>

          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input class="form-input" type="email" id="email" name="email" required autocomplete="email">
          </div>

          <div class="form-group">
            <label class="form-label" for="message">Message</label>
            <textarea class="form-textarea" id="message" name="message" rows="5" required></textarea>
          </div>

          <button class="form-submit" type="submit">Send</button>
        </form>
      </div>

    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-copy">© 2026 Veronika Bondarenko</span>
      <div class="footer-social">
        <a href="https://instagram.com/_veronikabondarenko" target="_blank" rel="noopener" aria-label="Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" stroke="none"/>
          </svg>
        </a>
      </div>
    </div>
  </footer>
</body>
</html>
